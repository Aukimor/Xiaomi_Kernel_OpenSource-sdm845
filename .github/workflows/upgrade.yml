name: Upgrade kernel (linux-stable merge)

on:
  workflow_dispatch:
    inputs:
      start:
        description: '起始小版本 (如 187)'
        required: true
        default: '187'
      end:
        description: '结束小版本 (如 250)'
        required: true
        default: '250'
      push_branch:
        description: '完成后 push 到哪个分支 (空=不 push)'
        required: false
        default: '88-zstd-upgrade'

env:
  OUT_DIR: "${{ github.workspace }}/out"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-22.04
    steps:
      - name: "⭐ Set up job"
        run: echo "kernel upgrade"

      - name: "🌟 Checkout kernel source (full history)"
        uses: actions/checkout@v4
        with:
          ref: '88-zstd'
          fetch-depth: 0

      - name: "🐍 Install prerequisites"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc curl git zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev wget libfl-dev python3

      - name: "🔧 Configure git"
        run: |
          git config --global user.name "Aukimor"
          git config --global user.email "1041854814@qq.com"

      - name: "🎲 Restore linux-stable bundle cache"
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: /tmp/linux-stable.bundle
          key: linux-stable-4.9-bundle-v2

      - name: "📡 Fetch linux-stable (linux-4.9.y)"
        run: |
          if [ -f /tmp/linux-stable.bundle ]; then
            echo "=== 从缓存 bundle 恢复 ==="
            git fetch /tmp/linux-stable.bundle 'refs/tags/*:refs/tags/*'
          else
            echo "=== 首次 fetch(慢),之后走缓存 ==="
            git remote add stable https://kernel.googlesource.com/pub/scm/linux/kernel/git/stable/linux-stable.git
            git fetch --progress stable linux-4.9.y --tags 2>&1 | tail -3
            git bundle create /tmp/linux-stable.bundle --tags v4.9.186 v4.9.337 $(git tag -l 'v4.9.187' | head -1) 2>/dev/null || \
            git bundle create /tmp/linux-stable.bundle --tags 2>/dev/null || \
            echo "bundle 创建失败,下次仍走网络"
          fi
          echo "=== 最新 v4.9.x tag ==="
          git tag -l 'v4.9.*' | tail -5

      - name: "🔍 Risk screen: risky subsystem commits in range"
        run: |
          RANGE="v4.9.${{ inputs.start }}..v4.9.${{ inputs.end }}"
          mkdir -p risk-audit
          {
            echo "=== 风险子系统提交清单 ($RANGE) ==="
            for path in drivers/scsi/ufs drivers/remoteproc drivers/iommu \
                        arch/arm64/boot/dts/qcom sound/soc/qcom \
                        drivers/tty/serial/msm_serial.c; do
              echo ""
              echo "===== $path ====="
              git log --oneline "$RANGE" -- "$path" 2>/dev/null | head -20
            done
            echo ""
            echo "=== 删除接口/取消导出/移动符号类提交(跨文件符号断裂高风险, 外部AI C方案) ==="
            git log --oneline "$RANGE" 2>/dev/null | grep -iE 'remove|drop|unexport|move .*(to|from)|revert' | head -40
          } > risk-audit/risky-commits.txt
          head -30 risk-audit/risky-commits.txt

      - name: "🔀 Merge linux-stable tags (auto-resolve known conflicts)"
        id: merge
        run: |
          # 清理可能残留的 merge 状态(防止上次中断污染)
          git merge --abort 2>/dev/null || true
          rm -f .git/MERGE_HEAD .git/MERGE_MSG .git/MERGE_MODE 2>/dev/null
          git checkout -B upgrade-work
          START=${{ inputs.start }}
          END=${{ inputs.end }}
          CONFLICT_LOG="$GITHUB_WORKSPACE/risk-audit/conflicts.txt"
          : > "$CONFLICT_LOG"
          OK=0
          FAIL=0
          for i in $(seq "$START" "$END"); do
            TAG="v4.9.$i"
            if git merge "$TAG" --no-edit > /tmp/merge.log 2>&1; then
              echo "✅ $TAG"
              OK=$((OK+1))
              continue
            fi
            # merge 失败但无冲突文件 = merge 本身没起来(如 dirty tree / 无关历史), 输出原因
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
            if [ -z "$CONFLICT_FILES" ]; then
              echo "❌ $TAG merge 失败(无未合并文件, 原始输出):" | tee -a "$CONFLICT_LOG"
              cat /tmp/merge.log | tee -a "$CONFLICT_LOG"
              FAIL=$((FAIL+1))
              break
            fi
            echo "⚠️ $TAG 冲突: $CONFLICT_FILES"
            RESOLVED=1
            for f in $CONFLICT_FILES; do
              case "$f" in
                Makefile|net/ipv6/ip6_tunnel.c|include/linux/siphash.h|drivers/nvmem/core.c|drivers/block/loop.c|kernel/cpu.c|drivers/of/Kconfig|drivers/net/phy/micrel.c|net/socket.c|include/uapi/drm/Kbuild|include/uapi/linux/Kbuild|include/asm-generic/vmlinux.lds.h|include/linux/thread_info.h|arch/arm64/mm/proc.S|include/net/sock.h|arch/arm64/kernel/module.lds|drivers/input/input.c|drivers/md/dm-verity-target.c|fs/fat/fatent.c)
                  # 保留双方内容(删除冲突标记行) - 双方各加不同代码行
                  sed -i '/^<<<<<<</d; /^=======$/d; /^>>>>>>>/d' "$f"
                  git add "$f"
                  echo "  → $f 手动合并(保留双方)"
                  ;;
                arch/arm64/kernel/smp.c)
                  # CAF 在此定义 cpu_number(per-cpu 变量), 全树 trace 头/fpsimd 引用它。
                  # 整文件 theirs(如 v4.9.218 的 smp_send_stop 修复)会删掉定义 → 链接期全树 undefined。
                  # 上游修复仅 smp_send_stop 边缘场景, 取舍: 保定义, 修复暂不 backport(登记)。
                  git checkout --ours "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  echo "  → arch/arm64/kernel/smp.c 保留 CAF(含 cpu_number 定义)"
                  ;;
                include/linux/fscrypto.h)
                  # CAF 用 fs/crypto/ 内部私有头, 不用上游的 include/linux/fscrypto.h;
                  # CAF 侧无此文件, checkout --ours 会失败 → 直接删除
                  git rm -f "$f" 2>/dev/null || true
                  echo "  → include/linux/fscrypto.h 删除(CAF 不用)"
                  ;;
                sound/usb/mixer.c|arch/arm/mm/init.c|scripts/mod/modpost.c|arch/arm64/kernel/psci.c|drivers/usb/host/xhci-mem.c|scripts/dtc/*|fs/userfaultfd.c|drivers/usb/host/xhci-plat.c|scripts/Kbuild.include|fs/eventpoll.c|net/ipv6/datagram.c|mm/page-writeback.c|drivers/md/dm-table.c|drivers/mmc/core/mmc.c|arch/arm64/include/asm/futex.h|drivers/mmc/core/core.c|drivers/usb/core/hub.c|sound/usb/card.c|fs/fs-writeback.c|security/selinux/avc.c|fs/gfs2/acl.c|drivers/staging/android/ion/ion_system_heap.c|kernel/exit.c|arch/arm/Makefile|drivers/media/dvb-core/dmxdev.c|drivers/staging/android/ion/ion.c|drivers/staging/android/ion/ion-ioctl.c|drivers/staging/android/ion/ion_priv.h|drivers/staging/android/ion/ion.h|drivers/usb/gadget/function/rndis.c|drivers/usb/gadget/function/rndis.h|net/ipv6/ip6_output.c|include/linux/bpf.h|drivers/nfc/st21nfca/se.c|mm/memory.c|net/key/af_key.c|net/xfrm/xfrm_policy.c|net/xfrm/xfrm_user.c|include/net/xfrm.h|drivers/mmc/core/host.c|arch/arm64/include/asm/cputype.h|arch/arm64/kernel/setup.c)
                  # 上游修复(USB音频/epoll loop check/page_alloc khugepaged), 通用框架代码非 CAF 定制
                  # 注: compress_offload.c 上游版删 snd_compress_free 但 compress_driver.h 仍引用 → 已移出到强制重置
                  git checkout --theirs "$f" 2>/dev/null || true
                  # 外部AI C方案: theirs 后检查相对 CAF 基线删除的导出符号是否仍有引用方。
                  # 命中 = 定义侧断裂风险(theirs 删了定义, 引用方仍在)。
                  # 范围仅 EXPORT_SYMBOL 导出符号; 未导出的全局符号(如 DEFINE_PER_CPU)不在覆盖内(诚实登记)。
                  for sym in $(git diff 88-zstd -- "$f" 2>/dev/null | grep -oP '^-EXPORT_SYMBOL(?:_GPL)?\(\K\w+' | sort -u); do
                    if git grep -l -E "\b$sym\b" -- '*.c' '*.h' 2>/dev/null | grep -v -q "^$f$"; then
                      echo "  ⚠️ 定义侧风险: $f theirs 删除导出符号 $sym, CAF 侧仍有引用:" | tee -a "$CONFLICT_LOG"
                      git grep -l -E "\b$sym\b" -- '*.c' '*.h' 2>/dev/null | grep -v "^$f$" | head -3 | sed 's/^/      /' | tee -a "$CONFLICT_LOG"
                    fi
                  done
                  git add "$f" 2>/dev/null || true
                  echo "  → $f 采用上游(修复)"
                  ;;
                fs/userfaultfd.c)
                  # CAF vm_write_begin 并发模型与上游 still_valid 修复交错复杂,
                  # 保守保留 CAF(后续可单独 backport still_valid)
                  git checkout --ours "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  echo "  → $f 保留 CAF 版(并发模型,保守)"
                  ;;
                drivers/tty/serial/msm_serial.c|kernel/irq/handle.c)
                  # CAF 的 TX reset 增强保留
                  git checkout --ours "$f" 2>/dev/null || git checkout --theirs "$f"
                  git add "$f"
                  echo "  → msm_serial.c 保留 CAF 版"
                  ;;
                kernel/sched/core.c|fs/f2fs/*|fs/ext4/*|drivers/pinctrl/qcom/*|drivers/thermal/thermal_core.c|drivers/tty/n_tty.c|drivers/usb/dwc3/*|drivers/input/touchscreen/atmel_mxt_ts.c|drivers/gpu/drm/drm_property.c|kernel/locking/spinlock_debug.c|arch/arm64/mm/mmu.c|net/wireless/util.c|drivers/md/dm.c|net/netfilter/xt_bpf.c|drivers/gpu/drm/msm/*|drivers/usb/gadget/function/f_fs.c|drivers/char/random.c|drivers/clk/qcom/*|include/uapi/linux/coresight-stm.h|drivers/scsi/ufs/*|drivers/of/base.c|sound/core/rawmidi.c|drivers/usb/gadget/function/f_uac2.c|drivers/hid/hid-core.c|include/linux/overflow.h|drivers/scsi/sd.c|drivers/usb/gadget/composite.c|kernel/time/hrtimer.c|drivers/usb/gadget/configfs.c|drivers/usb/gadget/udc/core.c|drivers/usb/host/xhci.c|drivers/irqchip/irq-gic.c|net/netlink/genetlink.c|include/net/genetlink.h|drivers/block/zram/*|fs/crypto/*|sound/core/compress_offload.c|kernel/fork.c|mm/page_alloc.c|mm/internal.h|include/linux/swap.h|arch/arm64/kernel/bpi.S|arch/arm64/kernel/entry.S|drivers/clocksource/Kconfig|include/linux/random.h|init/main.c|lib/Makefile|drivers/char/Kconfig|drivers/of/fdt.c|arch/arm64/kernel/setup.c|arch/arm64/kernel/cpu_errata.c|arch/arm64/kernel/cpufeature.c|mm/page-writeback.c)
                  # 这些文件是 CAF 私有 API 的定义侧(hrtimer_quiesce_cpu/create_function_device/
                  # usb_gadget_func_wakeup/usb_gsi_ep_op/xhci_handshake_check_state 等),
                  # 整文件 theirs 会在链接期切断全树调用链。上游修复暂不 backport(登记)。
                  # CAF 的 cpu_isolated_mask 处理是平台特性,上游简化版丢失
                  git checkout --ours "$f" 2>/dev/null || git checkout --ours -- "$f"
                  git add "$f"
                  echo "  → core.c 保留 CAF(含 isolated CPU 处理)"
                  ;;
                crypto/chacha20_generic.c|include/crypto/chacha20.h|lib/chacha20.c)
                  # 上游 RNG 重构新增的文件, 88-zstd 基线不存在。
                  # 它们与 random.h 改动纠缠产生 modify/delete 冲突, 直接删除最干净。
                  git rm -f --cached "$f" 2>/dev/null || true
                  rm -f "$f"
                  echo "  → $f 删除(上游新增, CAF 无此文件)"
                  ;;
                kernel/sched/*|drivers/android/*)
                  # CAF binder 是 Google lockless 重构,比上游 stable 新,
                  # 换上游老版本 binder 会破坏 Android 用户空间
                  git checkout --ours "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  echo "  → $f 保留 CAF 版(binder out-of-tree)"
                  ;;
                arch/arm64/configs/*|kernel/Makefile|drivers/cpufreq/Kconfig|block/Kconfig.iosched)
                  # 我们的移植/补丁文件保留 ours
                  git checkout --ours "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  echo "  → $f 保留 ours(移植补丁)"
                  ;;
                *)
                  # 未知冲突文件: 记录, 不自动解决
                  echo "  ❓ 未知冲突: $f" | tee -a "$CONFLICT_LOG"
                  RESOLVED=0
                  ;;
              esac
            done
            if [ "$RESOLVED" = "1" ]; then
              if git commit --no-edit > /dev/null 2>&1; then
                echo "✅ $TAG (冲突已自动解决)"
                OK=$((OK+1))
              else
                echo "❌ $TAG commit 失败" | tee -a "$CONFLICT_LOG"
                git merge --abort
                FAIL=$((FAIL+1))
                break
              fi
            else
              DETAILS=$(git diff --diff-filter=U 2>/dev/null)
              {
                echo "### $TAG 未知冲突详情:"
                echo "$DETAILS"
              } >> "$CONFLICT_LOG"
              git merge --abort
              FAIL=$((FAIL+1))
              echo "⏹️ 遇到未知冲突, 停止"
              break
            fi
          done
          echo ""
          echo "=== 统计: 成功 $OK, 失败 $FAIL ==="
          echo "last_version=$i" >> "$GITHUB_OUTPUT"
          echo "merge_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "merge_fail=$FAIL" >> "$GITHUB_OUTPUT"
          git log --oneline -3

      - name: "🔒 Force-protect directories (整目录 ours 防自动合并)"
        if: always()
        run: |
          # merge 规则只在冲突时生效,无冲突文件会被自动合入上游改动。
          # 对需要"整目录冻结"的子系统,merge 后强制重置到 CAF 基线。
          echo "=== 强制重置整目录 ours 的子系统 ==="
          for dir in fs/ext4 fs/f2fs drivers/scsi/ufs kernel/sched drivers/block/zram fs/crypto; do
            git checkout 88-zstd -- "$dir" 2>/dev/null && echo "  ✅ $dir 已重置到 CAF" || echo "  ⚠️ $dir 重置失败"
          done
          # 单文件保护(跨文件依赖必须整体 CAF)
          # fork.c/exit.c 不在此列: 上游 285 把 exit_robust_list 等从 fork.c 搬到 futex.c,
          # 强制重置 CAF 老版 fork.c 会与新 sched.h/futex.c 断裂(task_numa_free 双参等)。
          # 已验证两版导出符号一致, 无 CAF 私有 API → 判 theirs 自洽。
          for f in drivers/hid/hid-core.c include/linux/overflow.h drivers/scsi/sd.c drivers/usb/gadget/composite.c arch/arm64/kernel/smp.c kernel/time/hrtimer.c drivers/usb/gadget/configfs.c drivers/usb/gadget/udc/core.c drivers/usb/host/xhci.c drivers/irqchip/irq-gic.c net/netlink/genetlink.c include/net/genetlink.h sound/core/compress_offload.c mm/page_alloc.c mm/internal.h include/linux/swap.h include/linux/random.h init/main.c lib/Makefile drivers/char/Kconfig drivers/of/fdt.c drivers/char/random.c arch/arm64/include/asm/cpufeature.h arch/arm64/kernel/cpu_errata.c arch/arm64/kernel/cpufeature.c include/linux/bpf.h mm/page-writeback.c; do
            git checkout 88-zstd -- "$f" 2>/dev/null && echo "  ✅ $f 已重置" || echo "  ⚠️ $f 重置失败"
          done
          # 给 CAF overflow.h 补 check_shl_overflow(上游新增,vmalloc 等自动合入的代码引用它)
          if ! grep -q "check_shl_overflow" include/linux/overflow.h 2>/dev/null; then
            printf '\n/* upstream 4.9.x addition: needed by vmalloc etc. */\nstatic inline __must_check bool check_shl_overflow(unsigned long a, unsigned int s, unsigned long *d)\n{\n\tif (s >= BITS_PER_LONG)\n\t\treturn true;\n\t*d = a << s;\n\treturn a != (*d >> s);\n}\n' >> include/linux/overflow.h
            echo "  ✅ overflow.h 补 check_shl_overflow"
          fi
          # 给 CAF sched/core.c 补 sysctl_sched_rr_timeslice:
          # 上游 4.9.230 sysctl.c 的 sched_rr_timeslice_ms 表项指向新符号名(定义在上游 core.c),
          # kernel/sched 整目录重置成 CAF 后无此变量 → .data 段链接失败。
          # 注意: 该 sysctl 节点可读写但 CAF 调度实际用 RR_TIMESLICE 宏, 节点不生效(诚实登记)。
          if ! grep -q "sysctl_sched_rr_timeslice" kernel/sched/core.c 2>/dev/null; then
            printf '\n/* upstream 4.9.230 symbol: sysctl.c references it; CAF rt scheduler uses RR_TIMESLICE instead */\nint sysctl_sched_rr_timeslice __read_mostly = 1000;\n' >> kernel/sched/core.c
            echo "  ✅ core.c 补 sysctl_sched_rr_timeslice"
          fi
          # 给 CAF mmzone.h 补丁区: 上游 4.9.311 给 build_all_zonelists 加了第三参数
          # (bool hotplug_context), mmzone.h 自动合并成上游 3 参声明,
          # 而 CAF page_alloc.c(定义) 和 init/main.c(调用) 都是 2 参 → 断裂。
          # 实测上游 311 的 mm_init.c/memory_hotplug.c 均不调用此函数(调用方只有这两个文件),
          # 故把声明改回 2 参最省事。未来若上游新增 3 参调用方, 编译验证会立刻暴露。
          if grep -q "build_all_zonelists(pg_data_t \*pgdat, struct zone \*zone," include/linux/mmzone.h 2>/dev/null; then
            sed -i 's/void build_all_zonelists(pg_data_t \*pgdat, struct zone \*zone,$/void build_all_zonelists(pg_data_t *pgdat, struct zone *zone);/' include/linux/mmzone.h
            sed -i '/^			 bool hotplug_context);$/d' include/linux/mmzone.h
            echo "  ✅ mmzone.h build_all_zonelists 改回 2 参"
          fi
          # kernel/cpu.c: 上游 RNG 加了 CPUHP_RANDOM_PREPARE/AP_RANDOM_ONLINE 两个 hotplug 条目
          # 调 random_prepare_cpu/random_online_cpu(定义在 random.c), 但我们 random.c 是 CAF 版无此符号 → 断。
          # 直接删除这两个条目块(它们只是给随机数做 cpu 上下线同步, CAF random 不需要)。
          if grep -q "CPUHP_RANDOM_PREPARE" kernel/cpu.c 2>/dev/null; then
            sed -i '/\[CPUHP_RANDOM_PREPARE\]/,/^	},$/d' kernel/cpu.c
            echo "  ✅ cpu.c 删除 CPUHP_RANDOM_PREPARE 条目"
          fi
          if grep -q "CPUHP_AP_RANDOM_ONLINE" kernel/cpu.c 2>/dev/null; then
            sed -i '/\[CPUHP_AP_RANDOM_ONLINE\]/,/^	},$/d' kernel/cpu.c
            echo "  ✅ cpu.c 删除 CPUHP_AP_RANDOM_ONLINE 条目"
          fi
          # 一致性检查
          grep -q "s_writepages_rwsem" fs/ext4/ext4.h 2>/dev/null && echo "  ❌ ext4.h 仍有 s_writepages_rwsem" || echo "  ✅ ext4.h 无 s_writepages_rwsem"

      - name: "📊 Verification info"
        if: always()
        run: |
          {
            echo "=== 升级结果 ==="
            echo "成功: ${{ steps.merge.outputs.merge_ok }}"
            echo "失败: ${{ steps.merge.outputs.merge_fail }}"
            echo "最后处理: v4.9.${{ steps.merge.outputs.last_version }}"
            echo ""
            echo "=== 当前内核版本 ==="
            head -5 Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION"
            echo ""
            echo "=== 关键文件状态 ==="
            git status --short | head -10
          } | tee risk-audit/result.txt

      - name: "📁 Upload risk audit"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-audit-${{ inputs.start }}-${{ inputs.end }}
          path: risk-audit/

      - name: "🔨 Build kernel (compile validation)"
        if: ${{ always() && steps.merge.conclusion == 'success' }}
        run: |
          set -e
          # 下载 clang13 工具链
          git clone --depth=1 --branch clang13 https://github.com/diyishengqing/android-kernel-tools clang13
          TC=$PWD/clang13
          CC=$TC/clang/host/linux-x86/clang-r428724/bin/clang
          CX=$TC/linaro-gcc-4.9/aarch64-linux-gnu/bin/aarch64-linux-gnu-
          CX32=$TC/linaro-gcc-4.9/arm-linux-gnueabi/bin/arm-linux-gnueabi-
          # 1. 生成 runtime config(kernel/Makefile 的 config.gz 欺骗补丁需要)
          make O=out ARCH=arm64 CC=$CC CROSS_COMPILE=$CX HOSTCC=$CC HOSTCFLAGS="-fcommon -O2" polaris_stock_defconfig
          cp out/.config arch/arm64/configs/polaris_runtime_config
          # 2. 切回优化 defconfig
          make O=out ARCH=arm64 CC=$CC CROSS_COMPILE=$CX HOSTCC=$CC HOSTCFLAGS="-fcommon -O2" polaris_user_defconfig
          # 3. 编译内核(仅验证编译,不打包)
          make O=out ARCH=arm64 -j"$(nproc)" CC=$CC CROSS_COMPILE=$CX CROSS_COMPILE_ARM32=$CX32 HOSTCC=$CC HOSTCFLAGS="-fcommon -O2" 2>&1 | tee build.log
          # 检查产物
          ls -lh out/arch/arm64/boot/Image.gz-dtb 2>/dev/null && echo "✅ 编译成功" || { echo "❌ 编译失败"; exit 1; }

      - name: "🚀 Push to upgrade branch"
        if: ${{ inputs.push_branch != '' && steps.merge.outputs.merge_fail == '0' }}
        run: |
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Aukimor/Xiaomi_Kernel_OpenSource-sdm845.git" upgrade-work:${{ inputs.push_branch }} --force
